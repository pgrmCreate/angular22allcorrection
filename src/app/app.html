<header>
    <h1>{{ title() }}</h1>
</header>

<main>
    <h2>Mes tâches</h2>

    <!-- (added) : on écoute la sortie de TaskAdd ; $event contient le titre émis. -->
    <app-task-add (added)="ajouter($event)" />

    <!-- [tasks] : on passe le tableau de App à l'entrée de TaskList. -->
    <app-task-list [tasks]="tasks" />
</main>
