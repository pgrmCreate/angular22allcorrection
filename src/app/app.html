<header>
    <h1>{{ title() }}</h1>
</header>

<main>
    <!-- TP 4, pour aller plus loin : la Carte projette le titre (attribut « titre ») et le contenu. -->
    <app-carte>
        <h2 titre>Mes tâches ({{ remaining() }} restantes)</h2>

        <app-task-add (added)="ajouter($event)" />

        <!-- [tasks]="tasks()" : on passe la VALEUR du signal à l'entrée. -->
        <app-task-list [tasks]="tasks()" (toggled)="basculer($event)" (removed)="supprimer($event)" />
    </app-carte>

    <section>
        <app-member-form />
    </section>

    <section>
        <app-member-form-signal />
    </section>
</main>
