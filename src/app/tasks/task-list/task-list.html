<!--
    [(value)]="filtre" : liaison bidirectionnelle avec le model() de Filtre.
    On passe le signal lui-même (filtre), sans l'appeler.
    C'est un raccourci pour : [value]="filtre()" (valueChange)="filtre.set($event)"
-->
<app-filtre [(value)]="filtre" />

<ul class="taches">
    @for (task of visibles(); track task.id) {
        <!-- On relaie les sorties de TaskItem vers le parent (App). -->
        <app-task-item [task]="task" (toggled)="toggled.emit($event)" (removed)="removed.emit($event)" />
    } @empty {
        <li class="vide">
            {{ filtre() === 'toutes' ? 'Aucune tâche pour le moment.' : 'Aucune tâche dans ce filtre.' }}
        </li>
    }
</ul>
